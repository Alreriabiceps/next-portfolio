<html lang="en" class="dark">

    <title>Nexus | Digital Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              accent: {
                400: '#38bdf8', // Ice Blue
                500: '#0ea5e9',
                900: '#0c4a6e',
              },
              zinc: {
                850: '#1f1f22',
                900: '#18181b',
                950: '#09090b',
              },
              background: '#050505', // Deep black
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            backgroundImage: {
              'glass': 'linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%)',
            }
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; padding: 0; background-color: #050505; color: #e4e4e7; overflow-x: hidden; }
      /* Ultra thin scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
      
      .glass-panel {
        background: rgba(20, 20, 20, 0.4);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
